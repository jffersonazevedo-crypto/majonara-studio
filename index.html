
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10121b">
<title>MAJONARA STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#10121b;color:white;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-size:23px;font-weight:900}.logo span{color:#a78bfa}
small,.muted{color:#aaa}
h1{font-size:27px}p{color:#aaa;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.card,.project{background:#1d2030;border:1px solid #34384c;border-radius:14px;padding:16px}
.card span{font-size:25px}.card b{display:block;margin:10px 0}
button{padding:13px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-weight:bold}
.primary{width:100%;margin:12px 0}
input,select,textarea{width:100%;padding:13px;margin:8px 0 14px;background:#1d2030;color:white;border:1px solid #41465c;border-radius:9px;font-size:15px}
textarea{min-height:75px}
label{font-size:13px;color:#ccc}
section{margin-top:26px}
.hidden{display:none}
.project{margin:12px 0}
.project button{margin-top:12px;background:#34384c}
.tag{font-size:11px;color:#c4b5fd}
footer{text-align:center;color:#777;margin:35px 0;font-size:12px}
</style>
</head>
<body>
<header>
 <div><div class="logo">MAJONARA <span>STUDIO</span></div>
 <small>SEU ESTÚDIO DE CRIAÇÃO</small></div>
 <span>🎬</span>
</header>

<h1>Seu estúdio de criação.</h1>
<p>Planeje, produza e aprove seus vídeos.</p>

<div class="grid">
 <div class="card"><span>📡</span><b>RADAR</b><small>Tendências</small></div>
 <div class="card"><span>🧠</span><b>ROTEIRISTA</b><small>Roteiros</small></div>
 <div class="card"><span>🎙️</span><b>NARRAÇÃO</b><small>Voz própria e IA</small></div>
 <div class="card"><span>🎨</span><b>ANIMAÇÃO</b><small>Cenas e efeitos</small></div>
</div>

<button class="primary" onclick="showForm()">＋ NOVO PROJETO</button>

<section id="form" class="hidden">
<h2>Criar projeto</h2>
<label>Nome do projeto</label>
<input id="name" placeholder="Ex.: GTA VI Especial">

<label>Tema</label>
<textarea id="topic" placeholder="Descreva o assunto do vídeo"></textarea>

<label>Duração principal</label>
<select id="duration">
<option>5 a 8 minutos</option>
<option>1 a 3 minutos</option>
<option>15 a 60 segundos</option>
</select>

<label>Plataformas</label>
<select id="platform">
<option>YouTube + TikTok + Instagram</option>
<option>Somente YouTube</option>
<option>Somente TikTok</option>
<option>Somente Instagram</option>
</select>

<label>Narração</label>
<select id="voice">
<option>Minha voz</option>
<option>Voz de inteligência artificial</option>
<option>As duas opções</option>
</select>

<label>Estilo visual</label>
<select id="style">
<option>Anime cinematográfico</option>
<option>Animação 3D</option>
<option>Desenho 2D</option>
<option>Mangá animado</option>
<option>Motion graphics</option>
<option>Documentário com imagens</option>
</select>

<button onclick="saveProject()">SALVAR PROJETO</button>
<button onclick="hideForm()" style="background:#34384c">CANCELAR</button>
</section>

<section>
<h2>Meus projetos</h2>
<div id="projects"></div>
</section>

<footer>MAJONARA STUDIO © 2026</footer>

<script>
let projects=JSON.parse(localStorage.getItem("majonara_projects")||"[]");
function showForm(){document.getElementById("form").classList.remove("hidden")}
function hideForm(){document.getElementById("form").classList.add("hidden")}
function saveProject(){
let p={
id:Date.now(),
name:document.getElementById("name").value.trim(),
topic:document.getElementById("topic").value.trim(),
duration:document.getElementById("duration").value,
platform:document.getElementById("platform").value,
voice:document.getElementById("voice").value,
style:document.getElementById("style").value,
status:"Aguardando aprovação"
};
if(!p.name||!p.topic){alert("Preencha o nome e o tema.");return}
projects.push(p);
localStorage.setItem("majonara_projects",JSON.stringify(projects));
hideForm();render();
}
function removeProject(id){
if(!confirm("Excluir este projeto?"))return;
projects=projects.filter(p=>p.id!==id);
localStorage.setItem("majonara_projects",JSON.stringify(projects));
render();
}
function safe(s){
let d=document.createElement("div");d.textContent=s;return d.innerHTML;
}
function render(){
let area=document.getElementById("projects");
if(!projects.length){area.innerHTML="<p>Nenhum projeto cadastrado.</p>";return}
area.innerHTML=projects.map(p=>`
<div class="project">
<div class="tag">PROJETO</div>
<h3>${safe(p.name)}</h3>
<p>${safe(p.topic)}</p>
<p class="muted">Duração: ${safe(p.duration)}</p>
<p class="muted">Plataformas: ${safe(p.platform)}</p>
<p class="muted">Narração: ${safe(p.voice)}</p>
<p class="muted">Estilo: ${safe(p.style)}</p>
<p class="tag">Status: ${safe(p.status||"Em planejamento")}</p>
<button onclick="removeProject(${p.id})">EXCLUIR</button>
</div>`).join("");
}
render();
</script>
</body>
</html>
